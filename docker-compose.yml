# ────────────────────────────────────────────────────────────────────────────
# WebPanel — Master Service Stack
#
# Master containers (one per service):
#   traefik     — reverse proxy + Let's Encrypt SSL
#   powerdns    — authoritative DNS
#   mysql       — shared relational DB (customer DBs live here, isolated by schema)
#   postfix     — outbound SMTP
#   dovecot     — IMAP/POP3 (mail delivery)
#   redis       — shared cache / session store
#   webpanel    — FastAPI control panel API
#   prometheus  — metrics scraper (CPU, memory, disk, containers)
#   grafana     — metrics dashboards (port 3000)
#
# Customer containers are created dynamically by docker_mgr.py on the same
# webpanel_net network. They are NOT defined here.
# ────────────────────────────────────────────────────────────────────────────

networks:
  webpanel_net:
    name: webpanel_net
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/16
  docker_api_net:
    name: docker_api_net
    driver: bridge
    ipam:
      config:
        - subnet: 172.31.0.0/16

volumes:
  traefik_certs:
  mysql_data:
  powerdns_data:
  postfix_data:
  dovecot_data:
  redis_data:
  postgres_data:
  webpanel_sites:   # /var/webpanel/sites — customer public_html
  webpanel_db:      # panel SQLite DB
  webpanel_services: # secondary services installations
  prometheus_data:
  grafana_data:
  dkim_keys:        # DKIM private keys — written by panel API, read by OpenDKIM

services:

  # ── Docker API proxy ───────────────────────────────────────────────────────
  # nginx proxy in front of /var/run/docker.sock that rewrites legacy API
  # version paths (e.g. /v1.24/) to /v1.47/ so Traefik v3's Go Docker SDK
  # (which negotiates starting at v1.24) works with Docker Engine 29+ whose
  # minimum supported API is 1.40.
  docker-api-proxy:
    image: nginx:alpine
    container_name: webpanel_docker_api_proxy
    restart: unless-stopped
    mem_limit: 64m
    cpus: "0.25"
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - CHOWN
      - SETGID
      - SETUID
    group_add:
      - "${DOCKER_SOCK_GID:-129}"   # docker group GID so nginx user can read docker.sock
    networks:
      - docker_api_net
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./docker/docker-api-proxy/nginx.conf:/etc/nginx/nginx.conf:ro
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=64M
      - /var/run:noexec,nosuid,size=16M
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    # No external port exposure — internal to docker_api_net only

  # ── Traefik ────────────────────────────────────────────────────────────────
  traefik:
    image: traefik:v3.3
    container_name: webpanel_traefik
    restart: unless-stopped
    mem_limit: 256m
    cpus: "0.5"
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - CHOWN
      - SETGID
      - SETUID
    dns:
      - 8.8.8.8
      - 1.1.1.1
    networks:
      - webpanel_net
      - docker_api_net
    ports:
      - "80:80"
      - "127.0.0.1:25:25"
      - "127.0.0.1:587:587"
      - "127.0.0.1:143:143"
      - "127.0.0.1:993:993"
      - "127.0.0.1:110:110"
      - "127.0.0.1:995:995"
    volumes:
      - traefik_certs:/certs
      - ./docker/traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./docker/traefik/dynamic:/etc/traefik/dynamic:ro
    labels:
      - traefik.enable=true
      - traefik.http.routers.traefik-dash.rule=Host(`traefik.${PANEL_DOMAIN}`)
      - traefik.http.routers.traefik-dash.service=api@internal
      - traefik.http.routers.traefik-dash.tls=true
      - traefik.http.routers.traefik-dash.tls.certresolver=le
      - traefik.http.routers.traefik-dash.entrypoints=websecure
      - traefik.http.routers.traefik-dash.middlewares=dashboard-auth@file
    environment:
      - TZ=${TZ:-UTC}
      - ACME_EMAIL=${ACME_EMAIL}
      # Traefik native env var — overrides the static config value for ACME email.
      # This allows updating ACME_EMAIL in .env + docker compose up -d without
      # editing traefik.yml directly.
      - TRAEFIK_CERTIFICATESRESOLVERS_LE_ACME_EMAIL=${ACME_EMAIL}
    depends_on:
      - docker-api-proxy
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=64M
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8080/api/v1/servers/localhost || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3

  # ── PowerDNS ───────────────────────────────────────────────────────────────
  powerdns:
    image: powerdns/pdns-auth-49:latest
    container_name: webpanel_powerdns
    restart: unless-stopped
    mem_limit: 512m
    cpus: "1.0"
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - SETGID
      - SETUID
    networks:
      - webpanel_net
    ports:
      - "53:53/tcp"
      - "53:53/udp"
    volumes:
      - powerdns_data:/var/lib/powerdns
      - ./docker/powerdns/pdns.conf:/etc/powerdns/pdns.conf:ro
    environment:
      - PDNS_AUTH_API_KEY=${PDNS_API_KEY}
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=64M,uid=953,gid=953
      - /var/run:noexec,nosuid,size=16M,uid=953,gid=953
      - /etc/powerdns/pdns.d:noexec,nosuid,size=1M,uid=953,gid=953
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import os,urllib.request; req=urllib.request.Request('http://localhost:8081/api/v1/servers/localhost'); req.add_header('X-API-Key', os.environ['PDNS_AUTH_API_KEY']); print(urllib.request.urlopen(req, timeout=5).status)\""]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ── MySQL Master ───────────────────────────────────────────────────────────
  mysql:
    image: mysql:8.4
    container_name: webpanel_mysql
    restart: unless-stopped
    mem_limit: 2g
    cpus: "2.0"
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - SETGID
      - SETUID
    networks:
      - webpanel_net
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:-changeme_mysql_root}
      - MYSQL_DATABASE=webpanel
      - MYSQL_USER=webpanel
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-changeme_mysql}
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      retries: 5
      start_period: 30s

  # ── Redis ──────────────────────────────────────────────────────────────────
  redis:
    image: redis:8-alpine
    container_name: webpanel_redis
    restart: unless-stopped
    mem_limit: 512m
    cpus: "1.0"
    cap_drop:
      - ALL
    cap_add:
      - DAC_OVERRIDE
      - SETGID
      - SETUID
    networks:
      - webpanel_net
    volumes:
      - redis_data:/data
      - ./docker/redis/redis.conf:/etc/redis/redis.conf:ro
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-changeme_redis}", "ping"]
      interval: 15s
      timeout: 5s
      retries: 3
    command: sh -c "sed s/__REDIS_PW__/${REDIS_PASSWORD:-changeme_redis}/g /etc/redis/redis.conf > /tmp/redis.conf && exec redis-server /tmp/redis.conf"

  # ── PostgreSQL (shared DB server for customer sites) ────────────────────────
  postgres:
    image: postgres:17-alpine
    container_name: webpanel_postgres
    restart: unless-stopped
    mem_limit: 1g
    cpus: "1.0"
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    networks:
      - webpanel_net
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-changeme_postgres}
      - POSTGRES_USER=webpanel
      - POSTGRES_DB=webpanel
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U webpanel"]
      interval: 10s
      retries: 5
      start_period: 20s

  # ── OpenDKIM (DKIM signing milter) ─────────────────────────────────────────
  opendkim:
    build:
      context: ./docker/opendkim
      dockerfile: Dockerfile
    container_name: webpanel_opendkim
    restart: unless-stopped
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=32M
      - /run:noexec,nosuid,size=16M
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 8891 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - webpanel_net
    volumes:
      - dkim_keys:/etc/opendkim/keys

  # ── Postfix (outbound SMTP) ────────────────────────────────────────────────
  postfix:
    image: boky/postfix:latest
    container_name: webpanel_postfix
    restart: unless-stopped
    mem_limit: 512m
    cpus: "0.5"
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - CHOWN
      - DAC_OVERRIDE
      - SETGID
      - SETUID
    # Postfix needs writable rootfs for its entrypoint scripts and mail spool
    networks:
      - webpanel_net
    volumes:
      - postfix_data:/var/spool/postfix
    environment:
      - HOSTNAME=mail.${PANEL_DOMAIN}
      - RELAYHOST=${RELAYHOST:-}
      - ALLOWED_SENDER_DOMAINS=${ALLOWED_SENDER_DOMAINS:-}
      - POSTFIX_myhostname=mail.${PANEL_DOMAIN}
      - POSTFIX_smtpd_milters=inet:opendkim:8891
      - POSTFIX_non_smtpd_milters=inet:opendkim:8891
      - POSTFIX_milter_default_action=accept
    healthcheck:
      test: ["CMD-SHELL", "timeout 3 bash -c 'echo > /dev/tcp/localhost/25' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    depends_on:
      - opendkim
    labels:
      - traefik.enable=true
      - traefik.tcp.routers.smtp.rule=HostSNI(`*`)
      - traefik.tcp.routers.smtp.entrypoints=smtp
      - traefik.tcp.routers.smtp.service=smtp
      - traefik.tcp.services.smtp.loadbalancer.server.port=25
      - traefik.tcp.routers.submission.rule=HostSNI(`*`)
      - traefik.tcp.routers.submission.entrypoints=submission
      - traefik.tcp.routers.submission.service=submission
      - traefik.tcp.services.submission.loadbalancer.server.port=587

  # ── Dovecot (IMAP/POP3) ────────────────────────────────────────────────────
  dovecot:
    image: dovecot/dovecot:latest
    container_name: webpanel_dovecot
    restart: unless-stopped
    mem_limit: 512m
    cpus: "1.0"
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - CHOWN
      - SETGID
      - SETUID
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=64M
      - /var/run/dovecot:noexec,nosuid,size=16M
    healthcheck:
      test: ["CMD-SHELL", "timeout 3 bash -c 'echo > /dev/tcp/localhost/143' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - webpanel_net
    volumes:
      - dovecot_data:/var/mail
    environment:
      - USER_PASSWORD=${USER_PASSWORD:-admin}
    labels:
      - traefik.enable=true
      - traefik.tcp.routers.imap.rule=HostSNI(`*`)
      - traefik.tcp.routers.imap.entrypoints=imap
      - traefik.tcp.routers.imap.service=imap
      - traefik.tcp.services.imap.loadbalancer.server.port=143
      - traefik.tcp.routers.imaps.rule=HostSNI(`*`)
      - traefik.tcp.routers.imaps.entrypoints=imaps
      - traefik.tcp.routers.imaps.service=imaps
      - traefik.tcp.services.imaps.loadbalancer.server.port=993
      - traefik.tcp.routers.pop3.rule=HostSNI(`*`)
      - traefik.tcp.routers.pop3.entrypoints=pop3
      - traefik.tcp.routers.pop3.service=pop3
      - traefik.tcp.services.pop3.loadbalancer.server.port=110
      - traefik.tcp.routers.pop3s.rule=HostSNI(`*`)
      - traefik.tcp.routers.pop3s.entrypoints=pop3s
      - traefik.tcp.routers.pop3s.service=pop3s
      - traefik.tcp.services.pop3s.loadbalancer.server.port=995

  # ── WebPanel API ───────────────────────────────────────────────────────────
  webpanel:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: webpanel_api
    restart: unless-stopped
    mem_limit: 1g
    cpus: "1.0"
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    group_add:
      - "1001"                     # dkim group — shared GID with opendkim container for DKIM key access
    dns:
      - 127.0.0.11   # Docker embedded DNS (resolves service names like powerdns, mysql)
      - 8.8.8.8
      - 1.1.1.1
    networks:
      - webpanel_net
      - docker_api_net
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - webpanel_sites:/var/webpanel/sites           # customer files
      - webpanel_db:/app/data                        # SQLite DB
      - webpanel_services:/var/webpanel/services     # secondary services installations
      - ./frontend/dist:/app/frontend/dist:ro        # built React SPA
      - dkim_keys:/etc/opendkim/keys                 # write DKIM private keys + tables
      - /var/webpanel/panel_ssh:/var/webpanel/panel_ssh  # panel SSH keypair for container access
      - /var/webpanel/app-cache:/var/webpanel/app-cache  # marketplace app cache
      - /var/webpanel/localdns:/var/webpanel/localdns    # localdns hosts file (written by panel, read by dnsmasq)
      - ./docker/traefik/dynamic:/app/traefik_dynamic   # panel writes per-domain IP block configs; Traefik reads them
      # ── Secrets vault (read-only) ─────────────────────────────────────
      # Mounts the entire secrets vault at /run/secrets/ so panel code can
      # read environment variables, TLS certs, SSH keys, and config files
      # without storing them in image layers or env vars.
      # Set SECRETS_PATH in .env to the vault's actual directory.
      - ${SECRETS_PATH:-/opt/gnukontrolr/secrets/default}:/run/secrets:ro
    environment:
      - SECRET_KEY=${SECRET_KEY:-change_me_in_production}
      - SERVER_IP=${SERVER_IP}
      - PANEL_DOMAIN=${PANEL_DOMAIN}
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - ENCRYPTION_SALT=${ENCRYPTION_SALT}
      - DKIM_KEYS_DIR=/etc/opendkim/keys
      - MYSQL_HOST=mysql
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-changeme_mysql}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-changeme_redis}@redis:6379/0
      - PDNS_API_URL=http://powerdns:8081/api/v1/servers/localhost
      - PDNS_API_KEY=${PDNS_API_KEY:-changeme_pdns_key}
      - SMTP_HOST=postfix
      - SITES_ROOT=/var/webpanel/sites
      - DEBUG_LEVEL=${DEBUG_LEVEL:-0}
      - CONTAINER_API_TOKEN=${CONTAINER_API_TOKEN:-}
      - DOCKER_API_URL=http://webpanel_docker_api_proxy:2375
      - DOCKER_HOST=tcp://webpanel_docker_api_proxy:2375
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:-changeme_mysql_root}
      - LOCALDNS_HOSTS_FILE=/var/webpanel/localdns/panel.hosts
      - TRAEFIK_DYNAMIC_DIR=/app/traefik_dynamic
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
      postfix:
        condition: service_started
      powerdns:
        condition: service_started
      opendkim:
        condition: service_started
    labels:
      - traefik.enable=true
      # Single router + single service — both the SPA and API run on port 8000
      # of the same FastAPI process. Traefik would log warnings if multiple
      # services both point to the same port on the same container.
      - traefik.http.routers.webpanel.rule=Host(`${PANEL_DOMAIN}`)
      - traefik.http.routers.webpanel.tls=true
      - traefik.http.routers.webpanel.tls.certresolver=le
      - traefik.http.routers.webpanel.service=webpanel
      - traefik.http.services.webpanel.loadbalancer.server.port=8000

  # ── Prometheus ─────────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    container_name: webpanel_prometheus
    restart: unless-stopped
    mem_limit: 512m
    cpus: "0.5"
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    networks:
      - webpanel_net
    volumes:
      - prometheus_data:/prometheus
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=256M
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:9090/-/ready || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3

  # ── Grafana ────────────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:latest
    container_name: webpanel_grafana
    restart: unless-stopped
    mem_limit: 512m
    cpus: "1.0"
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=128M
    networks:
      - webpanel_net
    volumes:
      - grafana_data:/var/lib/grafana
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-changeme_grafana}
      - GF_SERVER_ROOT_URL=%(protocol)s://%(domain)s/grafana/
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
      - GF_AUTH_ANONYMOUS_ENABLED=false
      - GF_ANALYTICS_REPORTING_ENABLED=false
      - GF_ANALYTICS_CHECK_FOR_UPDATES=false
      - GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES=false
    labels:
      - traefik.enable=true
      - traefik.http.routers.grafana.rule=Host(`${PANEL_DOMAIN}`) && PathPrefix(`/grafana`)
      - traefik.http.routers.grafana.tls=true
      - traefik.http.routers.grafana.tls.certresolver=le
      - traefik.http.services.grafana.loadbalancer.server.port=3000
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3

  # ── Node Exporter (host metrics for Prometheus) ────────────────────────────
  node-exporter:
    image: prom/node-exporter:latest
    container_name: webpanel_node_exporter
    restart: unless-stopped
    mem_limit: 128m
    cpus: "0.25"
    cap_drop:
      - ALL
    cap_add:
      - SYS_PTRACE
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=64M
    networks:
      - webpanel_net
    pid: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - --path.procfs=/host/proc
      - --path.rootfs=/rootfs
      - --path.sysfs=/host/sys
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:9100/metrics || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3

  # ── cAdvisor (container metrics for Prometheus) ────────────────────────────
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1  # pinned — registry deprecated gcr.io
    container_name: webpanel_cadvisor
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=128M
    networks:
      - webpanel_net
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8080/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    cap_drop:
      - ALL
    cap_add:
      - SYS_ADMIN
      - SYS_PTRACE

  # ── Local DNS (dnsmasq) ────────────────────────────────────────────────────
  # Resolves all panel domains → SERVER_IP so the host (and any machine
  # pointing at it) can access customer sites without real public DNS.
  # Port 5353 on the host (port 53 is taken by PowerDNS).
  # The panel API writes /var/webpanel/localdns/panel.hosts and sends
  # SIGHUP to reload dnsmasq whenever a domain is created / updated / deleted.
  localdns:
    build:
      context: ./docker/localdns
      dockerfile: Dockerfile
    container_name: webpanel_localdns
    restart: unless-stopped
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - SETGID
      - SETUID
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=16M
    networks:
      - webpanel_net
    ports:
      - "5335:5300/udp"
      - "5335:5300/tcp"
    volumes:
      - /var/webpanel/localdns:/etc/localdns
    environment:
      - TZ=${TZ:-UTC}
    healthcheck:
      test: ["CMD-SHELL", "timeout 3 bash -c 'echo > /dev/udp/localhost/5300' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 3
