# ── GnuKontrolR Secrets Vault — Docker Compose Overlay ────────────────────────
# Include this file in your main docker-compose.yml to mount secrets:
#
#   docker compose -f docker-compose.yml -f docker-compose.secrets.yml up -d
#
# The vault is mounted read-only into the webpanel API container, so panel code
# can read environment variables and configs without storing secrets in image
# layers or environment variables visible via `docker exec`.
#
# Directory structure mounted at /run/secrets/:
#   /run/secrets/main.env           — master environment file
#   /run/secrets/pdns.conf          — PowerDNS config (with API key)
#   /run/secrets/tls/               — TLS certs and keys
#   /run/secrets/ssh/               — SSH keys
#   /run/secrets/dkim/              — DKIM signing keys
# ──────────────────────────────────────────────────────────────────────────────

# ── Secrets vault config ─────────────────────────────────────────────────────
# This UUID is generated once at install time.  You can find it in:
#   /opt/gnukontrolr/secrets/install.id
x-vault: &vault
  # Read-only mount of the entire secrets vault
  - /opt/gnukontrolr/secrets/356a78ee-e4ad-41ff-b644-0ad7e8bf6420:/run/secrets:ro

services:
  webpanel:
    volumes: *vault

  # Uncomment below to mount secrets into other containers:
  # powerdns:
  #   volumes:
  #     # Mount just the PowerDNS config so pdns.conf can reference
  #     # environment variables in /run/secrets/main.env
  #     - /opt/gnukontrolr/secrets/356a78ee-e4ad-41ff-b644-0ad7e8bf6420/config/pdns.conf:/etc/powerdns/pdns.conf:ro
