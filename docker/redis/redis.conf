# GnuKontrolR Redis Configuration
# Password is injected at container startup via sed substitution of
# __REDIS_PW__ with the REDIS_PASSWORD environment variable. This
# avoids exposing the password in the process command line (/proc/*/cmdline).

requirepass __REDIS_PW__

appendonly yes
appendfsync everysec
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# Memory management
maxmemory 384mb
maxmemory-policy allkeys-lru

# Security - rely on Docker network isolation (0.0.0.0 so other containers connect)
bind 0.0.0.0
protected-mode yes

# Performance
tcp-keepalive 300
timeout 0
