launch=gsqlite3
gsqlite3-database=/var/lib/powerdns/pdns.sqlite3
gsqlite3-dnssec=yes
gsqlite3-pragma-journal-mode=WAL
gsqlite3-pragma-synchronous=NORMAL

webserver=yes
webserver-address=127.0.0.1
webserver-port=8081
# Restrict API to Docker internal bridge only — not reachable from outside webpanel_net
webserver-allow-from=127.0.0.1,172.30.0.0/16

api=yes
# The API key is injected via PDNS_AUTH_API_KEY environment variable in
# docker-compose.yml (reads from .env PDNS_API_KEY). Config file fallback
# is intentionally left empty to force env-var-only configuration.
api-key=

local-address=0.0.0.0
local-port=53

dnsupdate=yes
log-dns-queries=no
log-dns-details=yes

# Include generated configs from pdns.d (e.g. _api.conf written by startup script)
include-dir=/etc/powerdns/pdns.d
